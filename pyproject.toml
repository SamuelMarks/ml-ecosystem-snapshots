[project]
name = "ml_ecosystem_snapshots"
description = "Extracts API snapshots from ML frameworks for Ghost Mode operation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
ml_ecosystem_snapshots = "ml_ecosystem_snapshots.cli:main"
ml-ecosystem-snapshots = "ml_ecosystem_snapshots.cli:main"
ml_framework_snapshots = "ml_ecosystem_snapshots.cli:main"
ml-framework-snapshots = "ml_ecosystem_snapshots.cli:main"

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ml_ecosystem_snapshots/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
generate = ["requirements-gen.txt"]
frameworks = ["requirements-frameworks.txt"]
test = ["test-requirements.txt"]
host = ["requirements-host.txt"]
linux_x64 = ["requirements-linux-x64.txt"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "ml_ecosystem_snapshots.models"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "ml_framework_snapshots.models"
disallow_subclassing_any = false

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
    "src/ml_framework_snapshots/*.json",
    "src/ml_framework_snapshots/*.json.gz",
    "src/ml_framework_snapshots/**/*.json",
    "src/ml_framework_snapshots/**/*.json.gz",
]
exclude = [
    "/.venv_311",
    "/.venv*",
    "/venv*",
    "/snapshots",
    "/test_out",
    "*.db",
    "*.db-*",
    "*.db-journal",
    "*.db-wal",
    "*.db-shm",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-journal",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_ecosystem_snapshots", "src/ml_framework_snapshots"]
include = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
    "src/ml_framework_snapshots/*.json",
    "src/ml_framework_snapshots/*.json.gz",
    "src/ml_framework_snapshots/**/*.json",
    "src/ml_framework_snapshots/**/*.json.gz",
]
artifacts = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
    "src/ml_framework_snapshots/*.json",
    "src/ml_framework_snapshots/*.json.gz",
    "src/ml_framework_snapshots/**/*.json",
    "src/ml_framework_snapshots/**/*.json.gz",
]
exclude = [
    "*.db",
    "*.db-*",
    "*.db-journal",
    "*.db-wal",
    "*.db-shm",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-journal",
]

[tool.ruff]
lint.select = ["E", "F", "D"]
lint.ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
