[project]
name = "ml_ecosystem_snapshots"
description = "Extracts API snapshots from ML frameworks for Ghost Mode operation"
authors = [{ name = "Samuel Marks" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
ml_ecosystem_snapshots = "ml_ecosystem_snapshots.cli:main"
ml-ecosystem-snapshots = "ml_ecosystem_snapshots.cli:main"

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ml_ecosystem_snapshots/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
generate = ["requirements-gen.txt"]
frameworks = ["requirements-frameworks.txt"]
test = ["test-requirements.txt"]
host = ["requirements-host.txt"]
linux_x64 = ["requirements-linux-x64.txt"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "../ml-switcheroo-ir/src"]
files = ["src", "tests", "scripts"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
strict = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "jax",
    "jax.*",
    "scipy",
    "scipy.*",
    "tensorflow",
    "tensorflow.*",
    "keras",
    "keras.*",
    "dask",
    "dask.*",
    "onnx",
    "onnx.*",
    "mlx",
    "mlx.*",
    "cupy",
    "cupy.*",
    "numba",
    "numba.*",
    "sparse",
    "sparse.*",
    "pyarrow",
    "pyarrow.*",
    "awkward",
    "awkward.*",
    "transformers",
    "transformers.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "ml_switcheroo_ir",
    "ml_switcheroo_ir.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "test_anti_hallucination",
    "test_api",
    "test_build_stablehlo_snapshot",
    "test_cli",
    "test_cli_check",
    "test_compliance_validation",
    "test_cupy_dask",
    "test_export",
    "test_framework_fallbacks",
    "test_framework_introspection",
    "test_frameworks",
    "test_lint_typing",
    "test_matrix_runner",
    "test_mcp_server",
    "test_mlir_traits",
    "test_models",
    "test_models_ast_fallbacks",
    "test_models_inspector",
    "test_scrape_amd_rdna",
    "test_scrape_mlir",
    "test_scrape_nvidia_ptx",
    "test_sphinx_rest",
    "test_stablehlo",
    "test_torch_aten",
    "test_torch_resilience",
    "test_update_shields",
]
disallow_any_unimported = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
]
exclude = [
    "/.venv_311",
    "/.venv*",
    "/venv*",
    "/snapshots",
    "/test_out",
    "*.db",
    "*.db-*",
    "*.db-journal",
    "*.db-wal",
    "*.db-shm",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-journal",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_ecosystem_snapshots"]
include = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
]
artifacts = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
]
exclude = [
    "*.db",
    "*.db-*",
    "*.db-journal",
    "*.db-wal",
    "*.db-shm",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-journal",
]

[tool.ruff]
target-version = "py310"
line-length = 300
lint.select = ["E", "F", "UP", "B", "I", "C901", "PLR09", "D"]
lint.ignore = ["E501", "B905", "UP038"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "docs/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
omit = [
    "tests/*",
    "docs/*",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = true
fail-under = 100
exclude = ["tests", "docs"]
ignore-regex = []
# possible values: 0 (minimal output), 1 (-v), 2 (-vv)
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"
