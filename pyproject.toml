[project]
name = "ml_ecosystem_snapshots"
description = "Extracts API snapshots from ML frameworks for Ghost Mode operation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
ml_ecosystem_snapshots = "ml_ecosystem_snapshots.cli:main"
ml-ecosystem-snapshots = "ml_ecosystem_snapshots.cli:main"

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ml_ecosystem_snapshots/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
generate = ["requirements-gen.txt"]
frameworks = ["requirements-frameworks.txt"]
test = ["test-requirements.txt"]
host = ["requirements-host.txt"]
linux_x64 = ["requirements-linux-x64.txt"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests", "scripts"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["ml_ecosystem_snapshots.models", "ml_ecosystem_snapshots.mcp.protocol"]
disable_error_code = ["overload-overlap"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
]
exclude = [
    "/.venv_311",
    "/.venv*",
    "/venv*",
    "/snapshots",
    "/test_out",
    "*.db",
    "*.db-*",
    "*.db-journal",
    "*.db-wal",
    "*.db-shm",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-journal",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_ecosystem_snapshots"]
include = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
]
artifacts = [
    "src/ml_ecosystem_snapshots/*.json",
    "src/ml_ecosystem_snapshots/*.json.gz",
    "src/ml_ecosystem_snapshots/**/*.json",
    "src/ml_ecosystem_snapshots/**/*.json.gz",
]
exclude = [
    "*.db",
    "*.db-*",
    "*.db-journal",
    "*.db-wal",
    "*.db-shm",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-journal",
]

[tool.ruff]
lint.select = ["E", "F", "D"]
lint.ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.interrogate]
ignore-overloaded-functions = true
