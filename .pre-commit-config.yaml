repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: pretty-format-json
        args: ["--autofix", "--indent=2"]
        files: ^snapshots/.*\.json$

  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format (Auto-Fix)
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: ruff-format-check
        name: Ruff Format (Check)
        entry: ruff format --check .
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff Lint
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: python3 -m mypy --config-file pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: lint-typing
        name: Lint Typing & Anti-Reflection
        entry: python3 scripts/lint_typing.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: lint-docstrings
        name: Lint Docstrings & Args/Returns/Raises
        entry: python3 scripts/lint_docstrings.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: interrogate
        name: Docstring Coverage (Interrogate)
        entry: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: check-no-db-files
        name: Check No Database Files Staged
        entry: bash -c '! git diff --cached --name-only | grep -E "\.(db|sqlite|sqlite3|db-wal|db-shm|db-journal|sqlite-journal)$"'
        language: system
        pass_filenames: false
        always_run: true
      - id: check-no-json-files
        name: Check No JSON Files Staged
        entry: bash -c '! git diff --cached --name-only | grep -iE "\.json(\.gz)?$"'
        language: system
        pass_filenames: false
        always_run: true
      - id: build
        name: Build
        entry: python3 -m build
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Test (Pytest)
        entry: bash -c 'ulimit -n 4096 2>/dev/null || true; python3 -m pytest -n 8 --cov=src/ml_ecosystem_snapshots --cov=scripts --cov-branch --cov-fail-under=100 && python3 scripts/check_function_coverage.py'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: update-shields
        name: Update Shields
        entry: python3 scripts/update_shields.py
        language: system
        pass_filenames: false
        always_run: true
