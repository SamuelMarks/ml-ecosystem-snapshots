name: "Automated Registry Bot"

on:
  schedule:
    # Run once a week on Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  generate-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"

      - name: Install dependencies and generate snapshots
        run: |
          uv pip install --system -e ".[generate]"
          for fw in torch jax tensorflow keras flax numpy; do
            uv pip install --system "$fw" || echo "Failed to install $fw, skipping."
          done
          python3 scripts/generate_all_snapshots.py torch jax tensorflow keras flax numpy || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ML framework snapshots"
          title: "Automated Snapshot Update"
          body: |
            ## Automated Snapshot Update

            This PR was automatically generated by the Snapshot Registry Bot.
            It contains updated JSON API snapshots for the latest versions of the configured ML frameworks.
          branch: "bot/update-snapshots"
          base: "main"
          labels: "automated pr, snapshots"
